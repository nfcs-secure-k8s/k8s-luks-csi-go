apiVersion: v1
kind: Namespace
metadata:
  name: luks-csi-staging
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    # The node SA can create pods here (staging-pod model). Enforce the
    # baseline Pod Security Standard so a compromised node SA cannot create a
    # privileged/hostPath escape pod in this namespace. The pause staging pod
    # (non-privileged, drops ALL caps, no host namespaces) satisfies baseline.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: luks-csi-backing
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: luks-csi-controller, namespace: {{ .Release.Namespace }} }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: luks-csi-node, namespace: {{ .Release.Namespace }} }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: luks-csi-controller }
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: luks-csi-controller }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: luks-csi-controller }
subjects:
  - { kind: ServiceAccount, name: luks-csi-controller, namespace: {{ .Release.Namespace }} }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: luks-csi-node }
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: luks-csi-node }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: luks-csi-node }
subjects:
  - { kind: ServiceAccount, name: luks-csi-node, namespace: {{ .Release.Namespace }} }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: luks-csi-staging, namespace: luks-csi-staging }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: luks-csi-staging, namespace: luks-csi-staging }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: luks-csi-staging }
subjects:
  - { kind: ServiceAccount, name: luks-csi-node, namespace: {{ .Release.Namespace }} }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: luks-csi-node-backing, namespace: luks-csi-backing }
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: luks-csi-node-backing, namespace: luks-csi-backing }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: luks-csi-node-backing }
subjects:
  - { kind: ServiceAccount, name: luks-csi-node, namespace: {{ .Release.Namespace }} }
